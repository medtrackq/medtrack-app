<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MedTrack — แดชบอร์ดผู้ดูแล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
<style>
:root {
  --ink-deep: #0F1A2E;
  --ink: #1A2840;
  --ink-light: #5A6A7A;
  --paper: #FAFAF7;
  --paper-warm: #F4EDE0;
  --bg: #F5F6FA;
  --card: #FFFFFF;
  --accent: #C8392F;
  --accent-soft: #E76F5A;
  --teal: #2B7A7A;
  --gold: #B8893A;
  --green: #16A34A;
  --green-soft: #DCFCE7;
  --yellow: #EAB308;
  --yellow-soft: #FEF3C7;
  --red: #DC2626;
  --red-soft: #FEE2E2;
  --line: #E5E7EB;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Sarabun', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 {
  font-family: 'Bai Jamjuree', sans-serif;
  font-weight: 700;
}

/* TOPBAR */
.topbar {
  background: var(--ink-deep);
  color: var(--paper);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand h1 {
  font-size: 20px;
  color: var(--paper);
}
.brand h1 .accent { color: var(--accent-soft); }
.brand .label {
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 600;
}

.role-switcher {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.1);
  padding: 4px;
  border-radius: 100px;
}
.role-btn {
  padding: 6px 14px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  font-size: 12px;
  font-family: 'Bai Jamjuree';
  font-weight: 600;
  border-radius: 100px;
  transition: all 0.15s;
}
.role-btn.active {
  background: white;
  color: var(--ink-deep);
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 16px;
}

/* DEMO BANNER */
.demo-banner {
  background: linear-gradient(135deg, #FFF8DC 0%, #FFE8B0 100%);
  border-left: 4px solid var(--gold);
  padding: 12px 20px;
  margin-bottom: 24px;
  border-radius: 6px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.demo-banner strong { color: var(--gold); font-family: 'Bai Jamjuree', sans-serif; }

/* GREETING CARD */
.greeting-card {
  background: linear-gradient(135deg, #2B7A7A 0%, #15494A 100%);
  color: white;
  padding: 24px;
  border-radius: 16px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.greeting-card::after {
  content: '';
  position: absolute;
  right: -40px;
  top: -40px;
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
}
.greeting-emoji {
  position: absolute;
  right: 24px;
  top: 24px;
  font-size: 48px;
  opacity: 0.3;
}
.greeting-text {
  font-size: 14px;
  opacity: 0.8;
  margin-bottom: 4px;
  position: relative;
}
.greeting-name {
  font-family: 'Bai Jamjuree';
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 12px;
  position: relative;
}
.greeting-care {
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}
.greeting-care strong {
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 16px;
}

/* HERO MESSAGE */
.hero-msg {
  background: white;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  text-align: center;
  box-shadow: var(--shadow);
}
.hero-msg-icon {
  font-size: 64px;
  margin-bottom: 12px;
}
.hero-msg-title {
  font-family: 'Bai Jamjuree';
  font-size: 22px;
  font-weight: 800;
  color: var(--green);
  margin-bottom: 6px;
}
.hero-msg-title.warn { color: var(--yellow); }
.hero-msg-title.bad { color: var(--red); }
.hero-msg-detail {
  color: var(--ink-light);
  font-size: 14px;
}

/* QUICK STATS */
.quick-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.qstat {
  background: white;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
  box-shadow: var(--shadow);
}
.qstat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-light);
  margin-bottom: 8px;
  font-family: 'Bai Jamjuree';
  font-weight: 700;
}
.qstat-value {
  font-family: 'Bai Jamjuree';
  font-weight: 800;
  font-size: 28px;
  line-height: 1;
  color: var(--ink-deep);
  margin-bottom: 4px;
}
.qstat-value .unit { font-size: 16px; color: var(--ink-light); }
.qstat-value.green { color: var(--green); }
.qstat-value.yellow { color: var(--yellow); }
.qstat-extra {
  font-size: 11px;
  color: var(--ink-light);
}

/* SECTION */
.section {
  margin-bottom: 24px;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
  padding: 0 4px;
}
.section-title h2 {
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .meta {
  font-size: 12px;
  color: var(--ink-light);
}

/* TODAY MEALS */
.meal-list {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.meal-row {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  gap: 16px;
}
.meal-row:last-child { border-bottom: none; }
.meal-icon-big {
  font-size: 32px;
  flex-shrink: 0;
}
.meal-info { flex: 1; }
.meal-name {
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 2px;
}
.meal-time {
  font-size: 12px;
  color: var(--ink-light);
  margin-bottom: 4px;
}
.meal-meds {
  font-size: 13px;
  color: var(--ink);
}
.meal-status {
  padding: 6px 14px;
  border-radius: 100px;
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 12px;
  white-space: nowrap;
}
.meal-status.confirmed {
  background: var(--green-soft);
  color: var(--green);
}
.meal-status.pending {
  background: #DBEAFE;
  color: #1D4ED8;
}
.meal-status.missed {
  background: var(--red-soft);
  color: var(--red);
}

/* WEEK CARDS */
.week-cards {
  display: grid;
  gap: 12px;
}
.week-card {
  background: white;
  padding: 16px 20px;
  border-radius: 12px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--green);
}
.week-card.current { border-left-color: var(--accent); }
.week-card.warn { border-left-color: var(--yellow); }
.week-card.bad { border-left-color: var(--red); }

.week-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.week-label {
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 14px;
  color: var(--ink-deep);
}
.week-label .badge {
  background: var(--accent);
  color: white;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 10px;
  margin-left: 8px;
  letter-spacing: 0.05em;
}
.week-percent {
  font-family: 'Bai Jamjuree';
  font-weight: 800;
  font-size: 20px;
  color: var(--green);
}
.week-percent.warn { color: var(--yellow); }
.week-percent.bad { color: var(--red); }

.week-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}
.day-pill {
  aspect-ratio: 1;
  background: var(--line);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 13px;
  color: white;
  position: relative;
}
.day-pill.full { background: var(--green); }
.day-pill.partial { background: var(--yellow); color: var(--ink-deep); }
.day-pill.missed { background: var(--red); }
.day-pill.today {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.day-pill.future {
  background: var(--bg);
  color: var(--ink-light);
  border: 1px dashed var(--line);
}

.week-summary {
  font-size: 12px;
  color: var(--ink-light);
}
.week-summary strong { color: var(--ink); }

/* INSIGHTS */
.insight-card {
  background: var(--paper-warm);
  border-left: 4px solid var(--gold);
  padding: 16px 20px;
  border-radius: 8px;
  margin-bottom: 12px;
}
.insight-icon {
  font-size: 24px;
  margin-bottom: 8px;
}
.insight-title {
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 6px;
  color: var(--gold);
}
.insight-body {
  font-size: 13px;
  line-height: 1.6;
}

/* TREND */
.trend-card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.trend-chart {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 120px;
  margin: 16px 0 12px;
}
.trend-bar {
  flex: 1;
  background: linear-gradient(180deg, #2B7A7A 0%, #16A34A 100%);
  border-radius: 6px 6px 0 0;
  position: relative;
  min-height: 12px;
}
.trend-bar.current {
  background: linear-gradient(180deg, #E76F5A 0%, #C8392F 100%);
}
.trend-bar-value {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 11px;
  white-space: nowrap;
  color: var(--ink-deep);
}
.trend-labels {
  display: flex;
  gap: 8px;
}
.trend-label {
  flex: 1;
  text-align: center;
  font-size: 11px;
  color: var(--ink-light);
  font-family: 'Bai Jamjuree';
  font-weight: 600;
}

/* QUICK ACTIONS */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.action-btn {
  background: white;
  padding: 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  font-family: 'Sarabun';
  transition: transform 0.1s;
}
.action-btn:active { transform: scale(0.97); }
.action-btn:hover { box-shadow: var(--shadow-lg); }
.action-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.action-text {
  font-family: 'Bai Jamjuree';
  font-weight: 600;
  font-size: 14px;
  color: var(--ink-deep);
}

/* APPOINTMENT */
.appt-card {
  background: linear-gradient(135deg, #FFF7E5, #FFE5CC);
  padding: 16px 20px;
  border-radius: 12px;
  border-left: 4px solid var(--gold);
  margin-bottom: 12px;
}
.appt-tag {
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.appt-doctor {
  font-family: 'Bai Jamjuree';
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 4px;
}
.appt-detail { font-size: 13px; }
.appt-detail strong { color: var(--accent); }

/* SECONDARY VIEW */
.simple-view { display: none; }
.simple-view.active { display: block; }
.detailed-view.hidden { display: none; }

@media (max-width: 600px) {
  .container { padding: 16px 12px; }
  .greeting-name { font-size: 20px; }
  .quick-stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .qstat { padding: 12px 8px; }
  .qstat-value { font-size: 22px; }
  .quick-actions { grid-template-columns: 1fr; }
  .meal-row { padding: 12px 16px; gap: 12px; }
  .meal-icon-big { font-size: 28px; }
  .day-pill { font-size: 11px; }
}
/* === เพิ่มเติมสำหรับ production === */
.meal-status.late { background: var(--yellow-soft); color: #B45309; }
.dose-time-badge {
  font-family: 'Bai Jamjuree'; font-weight: 800; font-size: 15px;
  color: var(--ink-deep); min-width: 56px; text-align: center;
}
.loading-screen, .error-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 70vh; text-align: center; padding: 40px 24px; gap: 16px;
}
.spinner {
  width: 44px; height: 44px; border: 4px solid var(--line);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-screen .emoji { font-size: 48px; }
.error-screen h2 { font-size: 20px; color: var(--ink); }
.error-screen p { color: var(--ink-light); font-size: 14px; max-width: 320px; }
.hidden { display: none !important; }
.dose-pill-mini {
  display: inline-block; padding: 2px 8px; border-radius: 100px;
  font-size: 11px; font-family: 'Bai Jamjuree'; font-weight: 700;
}
</style>
</head>
<body>
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <h1>หมอ<span class="accent">น้อย</span></h1>
      <div class="label">แดชบอร์ดผู้ดูแล</div>
    </div>
    <div id="tierBadge" class="role-switcher" style="display:none;">
      <span class="role-btn active" id="tierLabel">ผู้ดูแลหลัก</span>
    </div>
  </div>

  <!-- LOADING -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>

  </div>

  <div class="error-screen hidden" id="errorScreen">
    <div class="emoji">😕</div>
    <h2 id="errorTitle">ไม่สามารถโหลดข้อมูลได้</h2>
    <p id="errorMsg">กรุณาลองใหม่อีกครั้ง</p>

  <!-- MAIN CONTENT -->
  <div class="container hidden" id="mainContent">

    <div class="greeting-card">
      <div class="greeting-emoji">💚</div>
      <div class="greeting-text" id="greetDate">—</div>
      <div class="greeting-name" id="greetName">สวัสดี</div>
      <div class="greeting-care" id="greetCare">กำลังดูแล <strong>—</strong></div>

    <!-- HERO MESSAGE -->
    <div class="hero-msg" id="heroMsg">
      <div class="hero-msg-icon" id="heroIcon">📊</div>
      <div>
        <div class="hero-msg-title" id="heroTitle">—</div>

      </div>
    </div>

    <!-- QUICK STATS -->
    <div class="quick-stats" id="quickStats">
      <div class="qstat">
        <div class="qstat-label">วันนี้</div>
        <div class="qstat-value" id="statToday">—</div>
        <div class="qstat-extra" id="statTodayExtra">มื้อยา</div>
      </div>
      <div class="qstat">
        <div class="qstat-label">สัปดาห์นี้</div>
        <div class="qstat-value" id="statWeek">—<span class="unit">%</span></div>
        <div class="qstat-extra">กินตรงเวลา</div>
      </div>
      <div class="qstat">
        <div class="qstat-label">ต่อเนื่อง</div>
        <div class="qstat-value" id="statStreak">—</div>
        <div class="qstat-extra">วัน 🔥</div>
      </div>
    </div>

    <!-- TODAY DOSES -->
    <div id="patientSwitch"></div>
    <div class="section" id="todaySection">

    <!-- QUICK ACTIONS -->
    <div class="section" id="actionsSection">
      <div class="section-title"><h2>⚡ การกระทำ</h2></div>
      <div class="quick-actions" id="actionsList"></div>
    </div>

  </div>

<script>
const API_BASE = 'https://api.medtrackq.com';
const LIFF_ID = '2009969889-35ERQPQA';  // MedTrack Caregiver (Endpoint = caregiver-dashboard.html)

const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function showError(title, msg) {
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('mainContent').classList.add('hidden');
  const e = document.getElementById('errorScreen');
  e.classList.remove('hidden');
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent = msg;
}

// 🔐 ยืนยันตัวตนผ่าน LINE (LIFF access token) — server ตรวจกับ LINE เอง
let _accessToken = null, _data = null;
async function resolveAuth() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      if (liff.isInClient()) liff.login();
      else window.location.href = 'https://liff.line.me/' + LIFF_ID;   // นอก LINE → เปิดใน LINE app
      return null;
    }
    return liff.getAccessToken();
  } catch (e) {
    console.error('LIFF error', e);
    showError('เชื่อมต่อ LINE ไม่สำเร็จ', 'กรุณาเปิดหน้านี้ผ่าน LINE');
    return null;
  }
}

async function loadDashboard(patientId) {
  if (!_accessToken) _accessToken = await resolveAuth();
  if (!_accessToken) return;
  // ล้างค่าเก่าที่เคยเก็บ LINE ID ไว้ในเครื่อง
  try { sessionStorage.removeItem('mt_cg_lineid'); localStorage.removeItem('mt_caregiver_lineid'); } catch(e) {}
  try {
    const qs = patientId ? `?patient_id=${encodeURIComponent(patientId)}` : '';
    const res = await fetch(`${API_BASE}/api/caregivers/dashboard${qs}`, { headers: { Authorization: 'Bearer ' + _accessToken } });
    const data = await res.json();
    if (!data.ok) {
      if (data.error === 'line_auth_required') { try { liff.logout(); } catch(e) {} showError('ต้องเข้าสู่ระบบ LINE ใหม่', 'ปิดหน้านี้แล้วเปิดจาก LINE อีกครั้ง'); return; }
      showError('ไม่พบข้อมูล', data.message || 'ไม่สามารถโหลดข้อมูลได้');
      return;
    }
    _data = data;
    render(data);
  } catch (e) {
    console.error(e);
    showError('เกิดข้อผิดพลาด', 'กรุณาลองใหม่อีกครั้ง');
  }
}

const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const firstName = n => String(n || '').trim().split(/\s+/)[0] || 'ผู้ป่วย';

function renderSwitcher(d) {
  const box = document.getElementById('patientSwitch');
  if (!d.patients || d.patients.length < 2) { box.innerHTML = ''; return; }
  box.innerHTML = `<div style="display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px">` +
    d.patients.map(p => `<button onclick="loadDashboard(${p.id})" style="flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1.5px solid ${p.id === d.patient.id ? 'var(--teal,#0A9C7A)' : '#E2E8F0'};background:${p.id === d.patient.id ? 'var(--teal,#0A9C7A)' : '#fff'};color:${p.id === d.patient.id ? '#fff' : '#334155'};font:inherit;font-weight:700;font-size:13px">คุณ${esc(firstName(p.name))}</button>`).join('') + `</div>`;
}

function render(d) {
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  const secondary = d.tier === 'secondary';
  const pname = 'คุณ' + firstName(d.patient.name);

  document.getElementById('tierBadge').style.display = 'flex';
  document.getElementById('tierLabel').textContent = secondary ? 'ผู้ดูแลทั่วไป' : 'ผู้ดูแลหลัก';
  const now = new Date();
  document.getElementById('greetDate').textContent =
    `${now.getDate()} ${TH_MONTHS[now.getMonth()]} ${now.getFullYear()+543} · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('greetName').textContent = `สวัสดี คุณ${d.caregiver.name}`;
  document.getElementById('greetCare').innerHTML = `กำลังดูแล <strong>${esc(pname)}</strong>` + (!secondary && d.patient.age ? ` (${esc(d.patient.age)} ปี)` : '');
  renderSwitcher(d);

  const s = d.stats;
  const hero = document.getElementById('heroTitle'), heroDetail = document.getElementById('heroDetail'), heroIcon = document.getElementById('heroIcon');
  const left = s.today_pending;
  const cgNote = s.today_by_caregiver ? ` · ญาติยืนยัน ${s.today_by_caregiver} รายการ` : '';

  if (secondary) {
    // ผู้ดูแลทั่วไป: วันนี้กินครบหรือยัง + นัดหมอ เท่านั้น
    document.getElementById('quickStats').style.display = 'none';
    if (!s.today_total) { heroIcon.textContent = '📭'; hero.textContent = 'วันนี้ไม่มียาที่ต้องกิน'; hero.className = 'hero-msg-title'; heroDetail.textContent = ''; }
    else if (s.today_taken === s.today_total) { heroIcon.textContent = '✅'; hero.textContent = 'วันนี้กินยาครบแล้ว'; hero.className = 'hero-msg-title'; heroDetail.textContent = `${pname}กินครบทุกมื้อ${cgNote}`; }
    else if (s.today_missed) { heroIcon.textContent = '⚠️'; hero.textContent = 'วันนี้มีมื้อที่พลาด'; hero.className = 'hero-msg-title bad'; heroDetail.textContent = `ลองโทรถาม${pname}นะครับ`; }
    else { heroIcon.textContent = '⏳'; hero.textContent = 'วันนี้ยังกินไม่ครบ'; hero.className = 'hero-msg-title warn'; heroDetail.textContent = `ยังเหลือมื้อที่ยังไม่ได้ยืนยัน${cgNote}`; }
    document.getElementById('todayTitle').textContent = '🕐 มื้อวันนี้';
    renderSlots(d.today_slots);
    const done = (d.today_slots || []).filter(x => x.status === 'done').length;
    document.getElementById('todayMeta').textContent = `${done}/${(d.today_slots || []).length} มื้อ`;
    document.getElementById('trendSection').style.display = 'none';
    document.getElementById('insightsSection').classList.add('hidden');
    document.getElementById('actionsSection').style.display = 'none';
    renderAppointment(d.appointment);
    return;
  }

  document.getElementById('quickStats').style.display = '';
  document.getElementById('actionsSection').style.display = '';
  document.getElementById('todayTitle').textContent = '💊 ยาวันนี้';
  document.getElementById('statToday').innerHTML = `${s.today_taken}<span class="unit">/${s.today_total}</span>`;
  const statWeek = document.getElementById('statWeek');
  const wk = s.week_adherence;
  statWeek.innerHTML = wk == null ? '—' : `${wk}<span class="unit">%</span>`;
  statWeek.className = 'qstat-value ' + (wk == null ? '' : wk >= 80 ? 'green' : wk >= 50 ? 'yellow' : '');
  document.getElementById('statStreak').textContent = s.streak;
  if (wk == null) { heroIcon.textContent = '📊'; hero.textContent = 'เริ่มเก็บข้อมูลแล้ว'; hero.className = 'hero-msg-title'; heroDetail.textContent = 'ยังไม่มีมื้อที่ครบเวลาในสัปดาห์นี้'; }
  else if (wk >= 80) { heroIcon.textContent = '🎉'; hero.textContent = 'ดูแลได้ดีมาก'; hero.className = 'hero-msg-title'; heroDetail.textContent = `${pname} กินยาสม่ำเสมอ สัปดาห์นี้ ${wk}%`; }
  else if (wk >= 50) { heroIcon.textContent = '👀'; hero.textContent = 'ควรติดตามเพิ่ม'; hero.className = 'hero-msg-title warn'; heroDetail.textContent = `สัปดาห์นี้กินยา ${wk}% — มีบางมื้อที่ลืม`; }
  else { heroIcon.textContent = '⚠️'; hero.textContent = 'ต้องช่วยดูแลใกล้ชิด'; hero.className = 'hero-msg-title bad'; heroDetail.textContent = `สัปดาห์นี้กินยาเพียง ${wk}% — ควรโทรหา${pname}`; }

  renderTodayDoses(d.today_doses);
  document.getElementById('todayMeta').textContent = `${s.today_taken} กินแล้ว · ${left} รอ · ${s.today_missed} ขาด${cgNote}`;
  checkCaregiverReportButton(d.patient.id, d.appointment);
  if (!d.weeks || !d.weeks.length) document.getElementById('trendSection').style.display = 'none';
  else { document.getElementById('trendSection').style.display = ''; renderTrend(d.weeks); }
  renderInsights(d.insights, d.tier);
  renderAppointment(d.appointment);
  renderActions(d);
}

function renderSlots(slots) {
  const list = document.getElementById('todayList');
  if (!slots || !slots.length) { list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--ink-light);">ไม่มียาวันนี้</div>'; return; }
  const M = { done: ['confirmed', 'กินแล้ว'], missed: ['missed', 'พลาด'], pending: ['pending', 'ยังไม่ยืนยัน'] };
  list.innerHTML = slots.map(x => `
    <div class="meal-row">
      <div class="dose-time-badge">${esc(x.time)}</div>
      <div class="meal-info"><div class="meal-name">มื้อ ${esc(x.time)} น.</div>${x.by_caregiver ? '<div class="meal-meds">ญาติยืนยันแทน</div>' : ''}</div>
      <div class="meal-status ${M[x.status][0]}">${M[x.status][1]}</div>
    </div>`).join('');
}

function openSheet(title, html) {
  let ov = document.getElementById('cgSheet');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'cgSheet';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:9000;display:flex;align-items:flex-end;justify-content:center';
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div style="background:#fff;width:100%;max-width:520px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 28px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:17px;font-weight:800">${title}</div>
    <button onclick="document.getElementById('cgSheet').remove()" style="border:none;background:#F1F5F9;border-radius:50%;width:32px;height:32px;font-size:15px">✕</button></div>${html}</div>`;
}

function fmtThaiDate(iso) {
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  return `${d} ${TH_MONTHS[m - 1]} ${y + 543}`;
}

function showHistory() {
  const h = (_data && _data.history_30d) || [];
  if (!h.length) return openSheet('📊 ประวัติ 30 วัน', '<div style="color:#64748B;padding:16px 0">ยังไม่มีข้อมูล</div>');
  const tot = h.reduce((a, r) => ({ t: a.t + r.taken, m: a.m + r.missed, c: a.c + r.by_caregiver }), { t: 0, m: 0, c: 0 });
  const pct = (tot.t + tot.m) ? Math.round(100 * tot.t / (tot.t + tot.m)) : null;
  const rows = h.map(r => {
    const done = r.total && r.taken === r.total;
    const color = r.missed ? '#DC2626' : done ? '#059669' : '#64748B';
    return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:14px">
      <div>${fmtThaiDate(r.date)}${r.by_caregiver ? '<div style="font-size:11px;color:#64748B">ญาติยืนยัน ' + r.by_caregiver + ' รายการ</div>' : ''}</div>
      <div style="font-weight:700;color:${color}">${r.taken}/${r.total}${r.missed ? ' · พลาด ' + r.missed : ''}${r.pending ? ' · รอ ' + r.pending : ''}</div></div>`;
  }).join('');
  openSheet('📊 ประวัติ 30 วัน', `<div style="background:#F0FDF9;border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px">กินตรง <b>${pct == null ? '—' : pct + '%'}</b> · กินแล้ว ${tot.t} · พลาด ${tot.m}${tot.c ? ' · ญาติยืนยัน ' + tot.c : ''}</div>${rows}`);
}

function showAppointments() {
  const a = (_data && _data.appointments) || [];
  if (!a.length) return openSheet('📅 นัดหมอ', '<div style="color:#64748B;padding:16px 0">ยังไม่มีนัดที่กำลังจะถึง</div>');
  openSheet('📅 นัดหมอที่กำลังจะถึง', a.map(x => {
    const du = x.days_until, tag = du === 0 ? 'วันนี้' : du === 1 ? 'พรุ่งนี้' : `อีก ${du} วัน`;
    return `<div style="padding:12px;border:1px solid #E2E8F0;border-radius:14px;margin-bottom:10px">
      <div style="font-size:12px;color:#0A9C7A;font-weight:700">${tag}</div>
      <div style="font-weight:800;margin:2px 0">${fmtThaiDate(x.appointment_date)} ${x.appointment_time ? String(x.appointment_time).slice(0, 5) + ' น.' : ''}</div>
      <div style="font-size:13px;color:#475569">${esc(x.hospital_name || '')}${x.department ? ' · ' + esc(x.department) : ''}${x.doctor_name ? '<br>' + esc(x.doctor_name) : ''}${x.purpose ? '<br>นัดเพื่อ: ' + esc(x.purpose) : ''}</div></div>`;
  }).join(''));
}

function renderInsights(insights, tier) {
  const section = document.getElementById('insightsSection');
  const list = document.getElementById('insightsList');
  if (tier === 'secondary' || !insights || insights.length === 0) {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');
  list.innerHTML = '';
  insights.forEach(ins => {
    const card = document.createElement('div');
    card.className = 'insight-card';
    // type good = เขียว, warn = เหลือง/ทอง (default insight-card สีทอง)
    if (ins.type === 'good') {
      card.style.borderLeftColor = 'var(--green)';
    }
    let body = ins.detail || '';
    if (ins.suggestion) body += `<br><span style="color:var(--ink-light);">${ins.suggestion}</span>`;
    card.innerHTML = `
      <div class="insight-icon">${ins.icon || '💡'}</div>
      <div class="insight-title"${ins.type === 'good' ? ' style="color:var(--green)"' : ''}>${ins.title}</div>
      <div class="insight-body">${body}</div>
    `;
    list.appendChild(card);
  });
}

function renderActions(d) {
  const list = document.getElementById('actionsList');
  list.innerHTML = '';
  const p = d.patient, actions = [];
  if (p.phone) actions.push({ icon: '📞', text: `โทรหาคุณ${firstName(p.name)}`, fn: () => { window.location.href = 'tel:' + String(p.phone).replace(/[^\d+]/g, ''); } });
  actions.push({ icon: '📊', text: 'ดูประวัติเต็ม', fn: showHistory });
  actions.push({ icon: '📅', text: 'นัดหมอทั้งหมด', fn: showAppointments });
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.onclick = a.fn;
    btn.innerHTML = `<div class="action-icon">${a.icon}</div><div class="action-text">${esc(a.text)}</div>`;
    list.appendChild(btn);
  });
}

const STATUS_MAP = {
  taken:   { cls:'confirmed', label:'กินแล้ว' },
  late:    { cls:'late',      label:'กินช้า' },
  missed:  { cls:'missed',    label:'ขาด' },
  pending: { cls:'pending',   label:'รอ' },
};

function renderTodayDoses(doses) {
  const list = document.getElementById('todayList');
  list.innerHTML = '';
  if (!doses || doses.length === 0) {
    list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--ink-light);">ไม่มียาวันนี้</div>';
    return;
  }
  doses.forEach(dose => {
    const st = STATUS_MAP[dose.status] || STATUS_MAP.pending;
    const time = (dose.scheduled_time || '').slice(0,5);
    const tablets = parseFloat(dose.tablets_per_dose || 0);
    const tabStr = tablets ? `${tablets % 1 === 0 ? tablets : tablets} เม็ด` : '';
    // badge ยาหมด (กินครบแล้ว — ตรงกับหน้าคนไข้)
    const finishedBadge = dose.is_finished
      ? '<span style="background:#94A3B8;color:#fff;font-size:9px;padding:1px 7px;border-radius:8px;margin-left:6px">ยาหมด</span>'
      : '';
    const row = document.createElement('div');
    row.className = 'meal-row';
    if (dose.is_finished) row.style.opacity = '0.7';
    row.innerHTML = `
      <div class="dose-time-badge">${time}</div>
      <div class="meal-info">
        <div class="meal-name">${esc(dose.drug_name || dose.drug_name_en || 'ยา')}${finishedBadge}</div>
        <div class="meal-meds">${dose.dose_mg ? Number(dose.dose_mg) : ''} ${esc(dose.dose_unit||'')} ${tabStr ? '· '+tabStr : ''}${dose.confirmed_by === 'caregiver' ? ' · ญาติยืนยันแทน' : ''}</div>
      </div>
      <div class="meal-status ${st.cls}">${st.label}</div>
    `;
    list.appendChild(row);
  });
}

function renderTrend(weeks) {
  const chart = document.getElementById('trendChart');
  const labels = document.getElementById('trendLabels');
  chart.innerHTML = ''; labels.innerHTML = '';
  // weeks: [{weeks_ago, pct}] — weeks_ago 0=ปัจจุบัน, เรียงกลับให้เก่า→ใหม่
  const sorted = [...weeks].sort((a,b) => b.weeks_ago - a.weeks_ago);
  sorted.forEach(w => {
    const pct = parseInt(w.pct) || 0;
    const bar = document.createElement('div');
    bar.className = 'trend-bar' + (w.weeks_ago === 0 ? ' current' : '');
    // height px จาก 120px chart (min 12px ให้เห็นแท่งเสมอ)
    const h = Math.max(Math.round(pct / 100 * 108) + 12, 12);
    bar.style.height = h + 'px';
    bar.innerHTML = `<span class="trend-bar-value">${pct}%</span>`;
    chart.appendChild(bar);
    const lbl = document.createElement('div');
    lbl.className = 'trend-label';
    lbl.textContent = w.weeks_ago === 0 ? 'สัปดาห์นี้' : `${w.weeks_ago} สัปดาห์ก่อน`;
    labels.appendChild(lbl);
  });
}

function renderAppointment(appt) {
  const section = document.getElementById('apptSection');
  if (!appt) { section.style.display = 'none'; return; }
  section.style.display = '';
  const card = document.getElementById('apptCard');
  const d = new Date(appt.appointment_date);
  const dateStr = `${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
  const daysUntil = appt.days_until;
  const dayTag = daysUntil === 0 ? 'วันนี้' : daysUntil === 1 ? 'พรุ่งนี้' : `อีก ${daysUntil} วัน`;
  card.innerHTML = `
    <div class="appt-tag">📅 ${dayTag}</div>
    <div class="appt-doctor">${appt.doctor_name || 'พบแพทย์'}</div>
    <div class="appt-detail">
      <strong>${dateStr}</strong> ${appt.appointment_time||''}<br>
      ${appt.hospital_name||''} ${appt.department ? '· '+appt.department : ''}
      ${appt.purpose ? '<br>นัดเพื่อ: '+appt.purpose : ''}
    </div>
  `;
}

// ปุ่มสรุปก่อนพบหมอ — แสดงเมื่อใกล้วันนัด (ภายใน 3 วัน)
function checkCaregiverReportButton(patientId, appt) {
  const old = document.getElementById('cgReportBtn'); if (old) old.remove();
  if (!patientId || !appt || appt.days_until == null || appt.days_until > 3) return;
  const tag = appt.days_until === 0 ? 'วันนี้' : appt.days_until === 1 ? 'พรุ่งนี้' : `อีก ${appt.days_until} วัน`;
  const html = `
    <div id="cgReportBtn" onclick="window.open('medtrack-doctor.html?user_id=${patientId}&appointment_id=${appt.id}','_blank')"
         style="background:linear-gradient(135deg,#2563EB,#1d4ed8);border-radius:16px;padding:16px;color:#fff;margin-bottom:14px;box-shadow:0 6px 20px rgba(37,99,235,.3);cursor:pointer;position:relative;overflow:hidden">
      <div style="font-size:11px;opacity:.9;margin-bottom:3px">📅 นัดหมอ${tag}</div>
      <div style="font-size:17px;font-weight:800;margin-bottom:3px">สรุปให้หมอดู</div>
      <div style="font-size:12px;opacity:.9">เปิดให้หมอดูผลการกินยาตอนพบแพทย์</div>
      <div style="position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px">→</div>
    </div>`;
  const anchor = document.getElementById('heroMsg');
  anchor.insertAdjacentHTML('beforebegin', html);
}

loadDashboard();
</script>
</body>
</html>
